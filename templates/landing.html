{% extends "base.html" %}
{% block title %}Affect Companion{% endblock %}
{% block content %}
<div class="hero">
  <h1>{{ t.hero_title }}</h1>
  <p class="lead">{{ t.hero_lead }}</p>
  <div class="cta-row">
    <a href="/listener" class="cta-card primary">
      <span class="glyph">🎧</span>
      <span class="title">{{ t.cta_listener_title }}</span>
      <span class="desc">{{ t.cta_listener_desc }}</span>
    </a>
    <a href="/chat" class="cta-card">
      <span class="glyph">💬</span>
      <span class="title">{{ t.cta_chat_title }}</span>
      <span class="desc">{{ t.cta_chat_desc }}</span>
    </a>
  </div>
</div>
{% endblock %}
