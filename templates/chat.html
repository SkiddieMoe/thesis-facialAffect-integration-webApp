{% extends "base.html" %}
{% block title %}Chat — Affect Companion{% endblock %}
{% block content %}
<div class="chat-layout">
  <div class="chat-toolbar">
    <div class="toggle-pill" id="logTogglePill">
      <button data-view="chat" class="active">Chat</button>
      <button data-view="control">Control</button>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px">
      <input type="checkbox" id="webcamToggle" checked> Webcam
    </label>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <div class="input-row">
    <input type="text" id="chatInput" placeholder="Type a message…">
    <button class="icon-btn" id="micBtn" title="Voice message">🎙</button>
    <button class="btn btn-primary" id="sendBtn">Send</button>
  </div>

  <div id="debugSection" style="display:none;margin-top:14px;padding-top:10px;border-top:1px dashed var(--border)">
    <p class="hint">Debug: override detected emotion</p>
    <div id="debugButtons" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='chat.js') }}"></script>
{% endblock %}
