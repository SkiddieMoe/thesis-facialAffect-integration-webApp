{% extends "base.html" %}
{% block title %}Chat — Affect Companion{% endblock %}
{% block content %}
<div class="chat-layout">
  <div class="chat-toolbar">
    <div class="toggle-pill" id="logTogglePill">
      <button data-view="chat" class="active">{{ t.toggle_chat }}</button>
      <button data-view="control">{{ t.toggle_control }}</button>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px">
      <input type="checkbox" id="webcamToggle" checked> {{ t.webcam_label }}
    </label>
  </div>

  <p id="chatEmotionReadout" style="font-size:9px;color:var(--text-faint);text-transform:capitalize;margin:2px 0 4px">{{ t.detected_prefix }}: neutral</p>

  <div class="chat-log" id="chatLog"></div>

  <div class="input-row">
    <input type="text" id="chatInput" placeholder="{{ t.input_placeholder }}">
    <button class="icon-btn" id="micBtn" title="{{ t.mic_title }}">🎙</button>
    <button class="btn btn-primary" id="sendBtn">{{ t.btn_send }}</button>
  </div>

  <div id="debugSection" style="display:none;margin-top:14px;padding-top:10px;border-top:1px dashed var(--border)">
    <p class="hint">{{ t.debug_heading }}</p>
    <div id="debugButtons" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='chat.js') }}"></script>
{% endblock %}
